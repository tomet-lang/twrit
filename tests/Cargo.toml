[package]
name = "twrit-tests"
version.workspace = true
edition.workspace = true
publish = false

# Test targets live in `src/` and are declared explicitly, so the fixture
# directory is never mistaken for one.
autotests = false
autobins = false
autoexamples = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "api"
path = "src/api.rs"

[[test]]
name = "door"
path = "src/door.rs"

[[test]]
name = "guards"
path = "src/guards.rs"

[[test]]
name = "list"
path = "src/list.rs"

[[test]]
name = "mentions"
path = "src/mentions.rs"

[[test]]
name = "placement"
path = "src/placement.rs"

[[test]]
name = "python_api"
path = "src/python_api.rs"

[[test]]
name = "python_door"
path = "src/python_door.rs"

[[test]]
name = "metadata_cache"
path = "src/metadata_cache.rs"

[[test]]
name = "writ"
path = "src/writ.rs"

[dependencies]
twrit-core = { workspace = true }
twrit-rust = { workspace = true }
twrit-python = { workspace = true }
twrit-generic = { workspace = true }
anyhow = { workspace = true }
