name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test · Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Reads from Cachix only: this job builds the dev shell, which must not be pushed.
      # The package is built and pushed by nix-ci.yml.
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: tomet
          skipPush: true

      - name: Run checks & tests
        run: nix develop --command cargo test --workspace

      - name: Check docs
        run: nix develop --command just docs-check
