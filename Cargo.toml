[workspace]
resolver = "3"
members = [
  "app",
  "crates/twrit-core",
  "crates/twrit-rust",
  "crates/twrit-python",
  "crates/twrit-generic",
  "tests",
]
# The fixtures under `tests/fixtures/` are real Cargo workspaces -- the
# guards read them through `cargo metadata`, so an approximation would
# test the approximation. Each carries its own `[workspace]`, and this
# excludes them so the outer workspace does not try to claim them.
exclude = ["tests/fixtures"]

default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
twrit-core = { path = "crates/twrit-core" }
twrit-rust = { path = "crates/twrit-rust" }
twrit-python = { path = "crates/twrit-python" }
twrit-generic = { path = "crates/twrit-generic" }
twrit-cli = { path = "app" }

#= Tomet
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-extract = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-formatter = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git" }

#= Crates.io
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
rustpython-ast = "0.4"
rustpython-parser = "0.4"
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2"

[profile.dev.package."*"]
opt-level = 3
